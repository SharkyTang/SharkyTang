name: Refresh profile activity

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: profile-activity
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'SharkyTang/SharkyTang'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out the default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified 2026-10-07
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: true

      - name: Generate contribution assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update_activity.py

      - name: Commit changed activity assets
        run: |
          git add assets/activity.svg assets/activity-mobile.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh GitHub contribution snapshot'
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
